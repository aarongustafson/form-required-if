<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>form-required-if via esm.sh</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<h1>esm.sh CDN sanity check</h1>
		<p>
			This page loads the component class from <code>esm.sh</code> and
			registers it manually.
		</p>

		<form>
			<label for="contact-method">Preferred contact method</label>
			<select id="contact-method" name="contact-method">
				<option value="">Select one</option>
				<option value="email">Email</option>
				<option value="phone">Phone</option>
			</select>

			<form-required-if conditions="contact-method=email" indicator="*">
				<label for="email">Email (required when email selected)</label>
				<input type="email" id="email" name="email" />
			</form-required-if>
		</form>

		<script type="module">
			import { FormRequiredIfElement } from 'https://esm.sh/@aarongustafson/form-required-if@3.1.1/form-required-if.js?bundle&target=es2022';

			if (!customElements.get('form-required-if')) {
				customElements.define(
					'form-required-if',
					FormRequiredIfElement,
				);
			}
		</script>
	</body>
</html>
